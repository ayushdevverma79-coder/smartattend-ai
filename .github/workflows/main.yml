name: Extract v0 Zip

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and move files to root
        run: |
          unzip -o "*.zip" -d extracted_project
          cp -rf extracted_project/. .
          rm -rf extracted_project *.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "Extract v0 project files" || exit 0
          git push
