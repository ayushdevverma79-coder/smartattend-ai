name: Extract v0 Zip

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and move files to root
        run: |
          unzip -o "*.zip" -d extracted_project
          
          # Find package.json to locate the true project root
          PKG_PATH=$(find extracted_project -name "package.json" | head -n 1)
          TARGET_DIR=$(dirname "$PKG_PATH")
          
          # Move all extracted files (including hidden dotfiles) to the repo root
          cp -rf "$TARGET_DIR"/. .
          rm -rf extracted_project *.zip

      - name: Commit and push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "Extract v0 project files" || exit 0
          git push
